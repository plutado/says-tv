[project]
name = "says"
version = "0.1.0.dev0"
description = "Local-first podcast research tool: search who said what, on which episode, at what timestamp."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Fugate" }]
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
# Local speech-to-text. Not required for the core, the CLI, or the tests.
whisper = ["faster-whisper>=1.0"]

[project.scripts]
says = "says.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/says"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["says"]
known-local-folder = ["conftest"]
